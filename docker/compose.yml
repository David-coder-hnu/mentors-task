# Punching Bag 冒烟靶场 —— T1 的验收装置
#
# 验收（设计方案 :1178）：容器内在 --cap-add=NET_ADMIN --cap-add=NET_RAW 下起靶场，
# 从任一 netns ping 到配置前缀能收到回包。
#
# ── 为什么是「两个容器」而不是「一个容器里手搓 ip netns」────────────────────
# Docker 的每个容器本来就在自己的 network namespace 里，所以"从任一 netns ping"
# 用两个容器 + 一条自定义 IPv6 网络就能**如实地**表达，不必在容器内再叠一层 netns。
# （容器内建 netns 需要 /var/run/netns 的 mount propagation，会与默认 seccomp/apparmor
#  打架；等 harness 真需要内部 netns 时再单独解决，不该让它挡在门 0 前面。）
#
#   prober (2001:db8:1::3) ──┐
#                            ├── bridge, 2001:db8:1::/64
#   target (2001:db8:1::2) ──┘        ← punchingbag 监听 eth0
#
# ── 三个决定测试有效性的细节，缺一个测试就会以**错误的理由**通过 ────────────
#
#  1) **不能 ping target 自己的地址。** 那样的回包由 target 的**内核**发出，
#     与 Punching Bag 毫无关系。所以探测地址落在 `2001:db8:dead::/64`——
#     该前缀**不属于任何容器**，是被伪造的 aliased 前缀。
#
#  2) **prober 必须显式加路由。** `… via 2001:db8:1::2` 使得 L2 目的 MAC 是 target，
#     而 L3 目的地址是 dead::1。上游 `pcap_open_live(iface, BUFSIZ, 0, 100, …)` 的
#     第 3 个参数是 **promisc=0（非混杂）**，若不加这条路由，prober 会对 dead::1
#     直接做邻居发现、永远问不到 MAC，**一个包都发不出去**，然后表现为"靶场没回包"。
#
#  3) **必须有负对照。** `2001:db8:0bad::/64` 配成 rate 0.0，必须收不到回包。
#     只有正例的冒烟测试无法区分「config 真的生效了」与「config 没生效但碰巧通了」。
#
# ── 跑法 ────────────────────────────────────────────────────────────────
#   cd docker
#   docker compose up --build --abort-on-container-exit --exit-code-from prober
#   # 退出码 0 = 正例 5/5 且负对照 0/5；容器全部退出后记得 docker compose down
#
# ── 注意 ────────────────────────────────────────────────────────────────
#   smoke/punchingbag-smoke.json 是**本任务的脚手架**，不是 Stage 1 的配置规格；
#   后者归 T13（config/stage1_config.json）。别把它当基线配置引用。

name: punchingbag-smoke

services:
  target:
    build:
      context: .
      dockerfile: punchingbag.Dockerfile
    image: punchingbag:smoke
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./smoke/punchingbag-smoke.json:/config/smoke.json:ro
      # ── T2(b)：靶场的两个日志汇点必须能被**宿主**读到 ────────────────────
      # 为什么非要宿主导出：`packet_log.txt` **只在正常退出时 flush**
      # （`punchingbag.cpp:386`），所以吞吐标定的每一档必须走
      # `起靶场 → 跑探测 → **停靶场** → 读账本`，而「停靶场」与「读文件」
      # 这两步只能由宿主做（容器 `--rm` 之后里面的文件就没了）。
      # 若在靶场还活着的时候去读，**读到的是被截断的 `packet_log`**，
      # 于是第一层丢包（pcap 缓冲区溢出）会被**假报**成一大片。
      #
      # 靶场在自己的 CWD 里创建这两个文件（`:56`），所以挂 CWD 即可，
      # 不需要知道它用了什么文件名——文件名变了这里照样工作。
      - ./run/target-logs:/logs
    working_dir: /logs
    networks:
      pbnet:
        ipv6_address: 2001:db8:1::2
    command:
      - --interface=eth0
      - --json-config=/config/smoke.json
      - --thread-count=2

  prober:
    # T1 的冒烟装置：用系统 `ping` 证明靶场按 config 起效。它**不测 Python**。
    image: punchingbag:smoke
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      pbnet:
        ipv6_address: 2001:db8:1::3
    depends_on:
      - target
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # depends_on 只等容器启动，不等靶场就绪（pcap 还没打开时发的包会被丢掉）
        sleep 3

        ip -6 route add 2001:db8:dead::/64 via 2001:db8:1::2
        ip -6 route add 2001:db8:0bad::/64 via 2001:db8:1::2

        echo "=== 正例：2001:db8:dead::/64（rate 1.0）—— 期望 5/5 ==="
        ping -6 -c 5 -W 2 -i 0.3 2001:db8:dead::1

        echo "=== 负对照：2001:db8:0bad::/64（rate 0.0）—— 期望 0/5 ==="
        if ping -6 -c 5 -W 2 -i 0.3 2001:db8:0bad::1; then
          echo "FAIL: rate=0.0 的前缀收到了回包，config 未被遵守" >&2
          exit 1
        fi
        echo "OK: 负对照无回包，符合预期"

  # ── Stage 1 真靶场：32 个 /64，和调参 config 使用同一份真值 ────────────────
  stage1-target:
    profiles: ["stage1"]
    image: punchingbag:smoke
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ../config/stage1_config.json:/config/stage1.json:ro
      - ./run/stage1-target-logs:/logs
    working_dir: /logs
    networks:
      pbnet:
        ipv6_address: 2001:db8:1::2
    command:
      - --interface=eth0
      - --json-config=/config/stage1.json
      - --thread-count=4

  stage1-harness:
    profiles: ["stage1"]
    image: mentors-task-harness:dev
    cap_add:
      - NET_RAW
      - NET_ADMIN
    networks:
      pbnet:
        ipv6_address: 2001:db8:1::4
    depends_on:
      - stage1-target
    volumes:
      - ..:/w:ro
      - ./run:/out:rw
    working_dir: /w
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      SEEDS: "${SEEDS:-0-2}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        ip -6 route replace 2001:db8:5::/48 via 2001:db8:1::2
        exec python -m src.experiment \
          --config /w/config/stage1_config.json \
          --seeds "$$SEEDS" \
          --max-in-flight 256 \
          --out /out/stage1-smoke-table.rows.json \
          --strategy src.baselines.b0_probe_all:run \
          --strategy src.baselines.b1_uniform_random:run \
          --strategy src.baselines.b4_response_bandit:run \
          --strategy src.baselines.m1_memory_cold:run \
          --strategy src.baselines.m2_memory_warm:run

  # ── T2：`src/` 的集成测试跑在这里 ──────────────────────────────────────────
  #
  #   cd docker
  #   docker compose --profile harness run --rm harness
  #
  # `run` 会连带起 `target`（depends_on），但**不会**起 `prober`——
  # 所以冒烟和实弹两条路互不干扰。
  #
  # 为什么 profiled：不这样，`docker compose up` 会把 harness 一起拉起来，
  # 而 T1 的验收命令是 `--abort-on-container-exit --exit-code-from prober`，
  # 多一个容器就换了语义。profile 让它只在显式点名时出现。
  #
  # 源码是 **bind mount 进来的**（不是 COPY 进镜像）：改代码不用重建镜像。
  # `:ro` 是刻意的——测试不该写回工作树；pytest 的缓存写到容器内 tmp。
  harness:
    profiles: ["harness"]
    build:
      context: .
      dockerfile: harness.Dockerfile
    image: mentors-task-harness:dev
    cap_add:
      - NET_RAW
      - NET_ADMIN
    # 探测前缀的路由（`ip -6 route add …`）要改内核路由表，所以也要 NET_ADMIN。
    networks:
      pbnet:
        ipv6_address: 2001:db8:1::4
    depends_on:
      - target
    volumes:
      - ..:/w:ro
    working_dir: /w
    environment:
      # 别让 pytest 试图往只读的 /w 写缓存。
      PYTHONDONTWRITEBYTECODE: "1"
    # 解释器写在 command 里而不是用 ENTRYPOINT：这个镜像同时要能跑
    # `docker compose run --rm harness python -c '…'` 这类临时排查，
    # 钉死 ENTRYPOINT 会让每次都得加 `--entrypoint`。
    command:
      - python
      - -m
      - pytest
      - tests/integration
      - -v
      - -p
      - no:cacheprovider

networks:
  pbnet:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.31.66.0/24
        - subnet: 2001:db8:1::/64
